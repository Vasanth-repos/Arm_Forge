version: "3.9"
services:
  armforge:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/arm64      # REQUIRED — prevents x86 emulation
    ports:
      - "8080:8080"
    volumes:
      - ./results:/app/results
      - ${HOME}/armforge/models:/root/armforge/models:ro
    environment:
      - PYTHONUNBUFFERED=1
